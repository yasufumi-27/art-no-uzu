<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Warm, coarse artist's linen, based on the weave visible in top1/top3. -->
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.62" numOctaves="3" seed="17" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncR type="linear" slope="0.24" intercept="0.76"/><feFuncG type="linear" slope="0.24" intercept="0.76"/><feFuncB type="linear" slope="0.24" intercept="0.76"/></feComponentTransfer>
      <feBlend in="SourceGraphic" mode="multiply"/>
    </filter>
    <pattern id="weave" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#e8dfca"/>
      <path d="M1 0v8M5 0v8" stroke="#ad9e80" stroke-width="1" opacity=".26"/>
      <path d="M2 0v8M6 0v8" stroke="#fffaf0" stroke-width="1.3" opacity=".5"/>
      <path d="M0 1h8M0 5h8" stroke="#b3a48a" stroke-width=".8" opacity=".28"/>
      <path d="M0 2h8M0 6h8" stroke="#fff9e9" stroke-width="1.3" opacity=".42"/>
      <path d="M1 1h2M5 5h2" stroke="#f9f0db" stroke-width="2" opacity=".55"/>
      <path d="M5 1h2M1 5h2" stroke="#b4a589" stroke-width="1" opacity=".22"/>
    </pattern>
  </defs>
  <rect width="512" height="512" fill="url(#weave)" filter="url(#grain)"/>
</svg>
